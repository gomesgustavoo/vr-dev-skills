name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo:
    name: secrets, personal data, skill lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check_repo.py
        run: python tools/check_repo.py
      # The gitleaks CLI over the whole history, not gitleaks-action: the action scans
      # "<first pushed commit>^..HEAD", which git rejects on a repo's first push (no parent).
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
      - name: scripts start and print their usage
        run: |
          python skills/unity-quest-sim-loop/scripts/run_scenario.py || test $? -eq 2
          python skills/quest-build-deploy/scripts/quest_deploy.py --help
          python skills/horizon-os-mcp/scripts/mcp_probe.py --help
      - name: plugin manifest validates
        run: npx -y @anthropic-ai/claude-code plugin validate "$GITHUB_WORKSPACE"
        continue-on-error: true   # informational: the CLI needs no login for validate, but keep CI green if that changes
