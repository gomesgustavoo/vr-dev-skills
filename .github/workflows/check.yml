name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo:
    name: secrets, personal data, skill lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check_repo.py
        run: python tools/check_repo.py
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: scripts start and print their usage
        run: |
          python skills/unity-quest-sim-loop/scripts/run_scenario.py || test $? -eq 2
          python skills/quest-build-deploy/scripts/quest_deploy.py --help
          python skills/horizon-os-mcp/scripts/mcp_probe.py --help
      - name: plugin manifest validates
        run: npx -y @anthropic-ai/claude-code plugin validate "$GITHUB_WORKSPACE"
        continue-on-error: true   # informational: the CLI needs no login for validate, but keep CI green if that changes
