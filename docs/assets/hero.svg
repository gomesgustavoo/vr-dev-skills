<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">vr-dev-skills</title>
  <desc id="d">Simulator-first Meta Quest development with Claude Code: Unity and the Meta XR Simulator, the XR Operator, the Horizon OS MCP and headless Blender.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="0.55" stop-color="#0D1430"/>
      <stop offset="1" stop-color="#140B2E"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.75" r="0.55">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#F0ABFC"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2A4D"/>
      <stop offset="1" stop-color="#0F172E"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="420" rx="24"/></clipPath>
    <style>
      .t1 { font: 800 60px 'Segoe UI', 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1.5px; }
      .t2 { font: 600 24px 'Segoe UI', 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #E2E8F0; }
      .t3 { font: 400 17px 'Segoe UI', 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #94A3B8; }
      .chip { font: 600 15px 'Segoe UI', 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #E2E8F0; }
      .mono { font: 600 13px 'Cascadia Code', 'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace; fill: #A5F3FC; }
      .flow { stroke-dasharray: 6 10; animation: dash 1.6s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink 1.2s steps(2, start) infinite; }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      @keyframes pulse { 0%, 100% { opacity: 0.35; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes blink { to { visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse, .blink { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <rect width="1280" height="420" fill="url(#glowA)"/>
    <rect width="1280" height="420" fill="url(#glowB)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="24" fill="none" stroke="#334155" stroke-opacity="0.6"/>

  <!-- left: words -->
  <g transform="translate(64 0)">
    <g transform="translate(0 74)">
      <rect width="196" height="30" rx="15" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.45"/>
      <circle cx="18" cy="15" r="4.5" fill="#22D3EE" class="pulse"/>
      <text x="32" y="20" class="mono">claude code plugin</text>
    </g>
    <text x="0" y="170" class="t1" fill="url(#ink)">vr-dev-skills</text>
    <text x="0" y="212" class="t2">Simulator-first Meta Quest development with Claude Code</text>
    <text x="0" y="246" class="t3">Ask the app. Inject the input. Ask again. Keep the headset for what only hardware can answer.</text>

    <g transform="translate(0 286)">
      <g>
        <rect width="210" height="40" rx="12" fill="#0F172A" fill-opacity="0.75" stroke="#38BDF8" stroke-opacity="0.5"/>
        <rect x="14" y="13" width="14" height="14" rx="3" fill="none" stroke="#38BDF8" stroke-width="2"/>
        <text x="38" y="26" class="chip">Unity + XR Simulator</text>
      </g>
      <g transform="translate(224 0)">
        <rect width="196" height="40" rx="12" fill="#0F172A" fill-opacity="0.75" stroke="#818CF8" stroke-opacity="0.5"/>
        <circle cx="21" cy="20" r="7" fill="none" stroke="#818CF8" stroke-width="2"/>
        <circle cx="21" cy="20" r="2.5" fill="#818CF8"/>
        <text x="38" y="26" class="chip">XR Operator :8720</text>
      </g>
      <g transform="translate(434 0)">
        <rect width="190" height="40" rx="12" fill="#0F172A" fill-opacity="0.75" stroke="#C084FC" stroke-opacity="0.5"/>
        <path d="M14 27 L21 13 L28 27 Z" fill="none" stroke="#C084FC" stroke-width="2" stroke-linejoin="round"/>
        <text x="38" y="26" class="chip">Horizon OS MCP</text>
      </g>
      <g transform="translate(638 0)">
        <rect width="160" height="40" rx="12" fill="#0F172A" fill-opacity="0.75" stroke="#FB923C" stroke-opacity="0.55"/>
        <circle cx="22" cy="21" r="6.5" fill="none" stroke="#FB923C" stroke-width="2"/>
        <path d="M13 15 L22 21" stroke="#FB923C" stroke-width="2" stroke-linecap="round"/>
        <text x="38" y="26" class="chip">Blender CLI</text>
      </g>
    </g>
    <text x="0" y="370" class="mono" fill-opacity="0.85">$ /plugin install vr-dev@vr-dev-skills<tspan class="blink" fill="#67E8F9">▍</tspan></text>
  </g>

  <!-- right: headset in an ask -> act -> ask orbit -->
  <g transform="translate(1035 210)">
    <ellipse rx="190" ry="118" fill="none" stroke="url(#ring)" stroke-opacity="0.25" stroke-width="1.5"/>
    <ellipse rx="190" ry="118" fill="none" stroke="url(#ring)" stroke-width="2.2" class="flow"/>
    <ellipse rx="135" ry="80" fill="none" stroke="#475569" stroke-opacity="0.35" stroke-dasharray="2 8"/>

    <!-- headset -->
    <g>
      <rect x="-30" y="-58" width="60" height="18" rx="9" fill="none" stroke="#475569" stroke-width="3"/>
      <rect x="-104" y="-46" width="208" height="96" rx="40" fill="url(#visor)" stroke="url(#ring)" stroke-width="2.5"/>
      <rect x="-90" y="-33" width="180" height="70" rx="30" fill="#0B1226" stroke="#334155"/>
      <circle cx="-42" cy="2" r="22" fill="#0E1A33" stroke="#22D3EE" stroke-opacity="0.8" stroke-width="2"/>
      <circle cx="42" cy="2" r="22" fill="#0E1A33" stroke="#C084FC" stroke-opacity="0.8" stroke-width="2"/>
      <circle cx="-42" cy="2" r="8" fill="#22D3EE" class="pulse"/>
      <circle cx="42" cy="2" r="8" fill="#C084FC" class="pulse" style="animation-delay: 1.2s"/>
      <path d="M-26 52 C-17 33 17 33 26 52 Z" fill="#0B1024"/>
      <path d="M-26 50.5 C-17 33 17 33 26 50.5" fill="none" stroke="url(#ring)" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- orbiting packets -->
    <g>
      <circle r="6" fill="#67E8F9">
        <animateMotion dur="6s" repeatCount="indefinite" path="M190 0 A190 118 0 1 1 -190 0 A190 118 0 1 1 190 0"/>
      </circle>
      <circle r="5" fill="#F0ABFC">
        <animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M190 0 A190 118 0 1 1 -190 0 A190 118 0 1 1 190 0"/>
      </circle>
    </g>
    <g class="mono" text-anchor="middle">
      <rect x="-48" y="-150" width="96" height="26" rx="13" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.55"/>
      <text x="0" y="-132">ask</text>
      <rect x="140" y="-13" width="96" height="26" rx="13" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.55"/>
      <text x="188" y="5">act</text>
      <rect x="-48" y="124" width="96" height="26" rx="13" fill="#0F172A" stroke="#C084FC" stroke-opacity="0.55"/>
      <text x="0" y="142">ask again</text>
      <rect x="-236" y="-13" width="96" height="26" rx="13" fill="#0F172A" stroke="#FB923C" stroke-opacity="0.55"/>
      <text x="-188" y="5">gate it</text>
    </g>
  </g>
</svg>
