<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Four loops, cheapest first</title>
  <desc id="d">L0 compile check and headless gates take 10 to 90 seconds; L1 simulator checks take seconds each; L2 development APK on a worn headset about four minutes; L3 release APK about four minutes. Climb only as far as the question needs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/><stop offset="1" stop-color="#0F1530"/>
    </linearGradient>
    <linearGradient id="g0" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <linearGradient id="g3" x1="0" x2="1"><stop offset="0" stop-color="#C084FC"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <style>
      text { font-family: 'Segoe UI', 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .h { font-size: 24px; font-weight: 800; fill: #F1F5F9; }
      .sub { font-size: 14px; fill: #94A3B8; }
      .lv { font-size: 20px; font-weight: 800; fill: #0B1020; }
      .nm { font-size: 16px; font-weight: 700; fill: #F1F5F9; }
      .pr { font-size: 13.5px; fill: #94A3B8; }
      .ti { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, Menlo, monospace; font-size: 14px; font-weight: 700; }
      .badge { font-size: 12px; font-weight: 800; letter-spacing: 1px; fill: #0B1020; }
      .grow { animation: grow 1.6s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: left center; }
      .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { .grow { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="400" rx="22" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="22" fill="none" stroke="#334155" stroke-opacity="0.6"/>
  <text x="48" y="54" class="h">Four loops, cheapest first</text>
  <text x="48" y="78" class="sub">Climb only as far as the question needs. Most bugs are found, fixed and gated in L1.</text>

  <!-- rows: label | bar (time, log-ish) | what it proves -->
  <g transform="translate(48 108)">
    <rect width="54" height="54" rx="14" fill="url(#g0)"/><text x="27" y="35" text-anchor="middle" class="lv">L0</text>
    <text x="72" y="22" class="nm">Compile check + headless gates</text>
    <text x="72" y="44" class="pr">quickcheck.ps1 (Roslyn, no project lock) · build gates</text>
    <rect x="520" y="16" width="120" height="22" rx="11" fill="url(#g0)" class="grow"/>
    <text x="652" y="33" class="ti" fill="#67E8F9">10 s – 90 s</text>
    <text x="880" y="33" class="pr">compiles (editor + player defines), scene wired</text>
  </g>
  <g transform="translate(48 176)">
    <rect width="54" height="54" rx="14" fill="url(#g1)"/><text x="27" y="35" text-anchor="middle" class="lv">L1</text>
    <text x="72" y="22" class="nm">Editor + XR Simulator + Operator</text>
    <text x="72" y="44" class="pr">ask → act → ask · run_scenario.py suites · pixel diffs</text>
    <rect x="520" y="16" width="70" height="22" rx="11" fill="url(#g1)" class="grow d1"/>
    <text x="602" y="33" class="ti" fill="#93C5FD">seconds / check</text>
    <text x="880" y="33" class="pr">simulated input changes state as intended</text>
    <rect x="362" y="5" width="112" height="22" rx="11" fill="#38BDF8"/>
    <text x="418" y="20" text-anchor="middle" class="badge">BUGS DIE HERE</text>
  </g>
  <g transform="translate(48 244)">
    <rect width="54" height="54" rx="14" fill="url(#g2)"/><text x="27" y="35" text-anchor="middle" class="lv">L2</text>
    <text x="72" y="22" class="nm">Dev APK on a worn headset</text>
    <text x="72" y="44" class="pr">Operator over adb forward · adb channel · VrApi · Perfetto</text>
    <rect x="520" y="16" width="236" height="22" rx="11" fill="url(#g2)" class="grow d2"/>
    <text x="768" y="33" class="ti" fill="#C4B5FD">~4 min</text>
    <text x="880" y="33" class="pr">real tracking, hands, Adreno GPU, perf</text>
  </g>
  <g transform="translate(48 312)">
    <rect width="54" height="54" rx="14" fill="url(#g3)"/><text x="27" y="35" text-anchor="middle" class="lv">L3</text>
    <text x="72" y="22" class="nm">Release APK + smoke checklist</text>
    <text x="72" y="44" class="pr">no Operator layer, no dev tools: the build that ships</text>
    <rect x="520" y="16" width="236" height="22" rx="11" fill="url(#g3)" class="grow d3"/>
    <text x="768" y="33" class="ti" fill="#F9A8D4">~4 min</text>
    <text x="880" y="33" class="pr">the store build, VRC rules, a human check</text>
  </g>
</svg>
